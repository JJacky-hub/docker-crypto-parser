events {}

http {
    server {
        listen 80;
        server_name crypt0-parser.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name crypt0-parser.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/crypt0-parser.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crypt0-parser.duckdns.org/privkey.pem;

        # Основное приложение и WebSockets
        location / {
            proxy_pass http://crypto_parser_app:8000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 1. Проксирование pgAdmin (PostgreSQL GUI)
        location /pgadmin/ {
            proxy_pass http://crypto_pgadmin:80/;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Проксирование RedisInsight (Redis GUI)
        location /redis {
            return 301 http://$host:5540;
        }
