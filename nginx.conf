events {}

http {
    server {
        listen 80;
        server_name crypto-parser.online api.crypto-parser.online;

        location / {
            proxy_pass http://crypto_parser_app:8000;
            proxy_set_header Host $host;
            
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 1. Проксирование pgAdmin (PostgreSQL GUI)
        location /pgadmin/ {
            proxy_pass http://crypto_pgadmin:80/;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Проксирование RedisInsight (Redis GUI)
        location /redis {
            return 301 http://$host:5540;
        }
    }
}
