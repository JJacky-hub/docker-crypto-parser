events {}

http {
    server {
        listen 80;
        server_name crypt0-parser.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name crypt0-parser.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/crypt0-parser.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crypt0-parser.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://crypto_parser_app:8000;
            
            # Поддержка WebSockets и обычного HTTP
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            # Заголовки хоста и IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты (чтобы Nginx не закрывал открытый сокет через 60 секунд)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
