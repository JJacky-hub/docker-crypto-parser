version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crypto_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWOR: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    ports:
      - "6379:6379"
    restart: always

  crypto_parser_app:
    build: .
    container_name: crypto_parser_app
    command: uvicorn crypto:app --host 0.0.0.0 --port 8000
    working_dir: /app
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  # 1. Веб-панель для PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    restart: always


  # 2. Веб-панель для Redis
  redisinsight:
    image: redis/redisinsight:latest
    container_name: crypto_redisinsight
    ports:
      - "5540:5540"
    restart: always

  nginx:
    image: nginx:latest
    container_name: crypto_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - crypto_parser_app
      - pgadmin
      - redisinsight
    restart: always

  worker:
    build: .
    container_name: crypto_parser_worker
    restart: always
    working_dir: /app
    command: taskiq worker broker:broker tasks
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  scheduler:
    build: .
    container_name: crypto_parser_scheduler
    restart: always
    working_dir: /app
    command: taskiq scheduler scheduler:scheduler
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=${REDIS_URL}
    volumes:
      - .:/app
    depends_on:
      - redis
      - worker

volumes:
  postgres_data:
