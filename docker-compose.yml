version: '3.8'

services:
  # Наша СУБД PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: crypto_postgres
    environment:
      POSTGRES_DB: crypto_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: super_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Наш Python-парсер
  crypto_monitoring:
    build: .
    container_name: btc_live_parser
    network_mode: host
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=127.0.0.1
      - DB_NAME=crypto_db
      - DB_USER=postgres_user
      - DB_PASS=super_password

# Объявляем именованный volume для безопасного хранения данных СУБД на хосте
volumes:
  pg_data:
