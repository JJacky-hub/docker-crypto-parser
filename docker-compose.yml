services:

  db:
    image: postgres:15-alpine
    container_name: crypto_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: always

  crypto_parser_app:
    build: .
    container_name: crypto_parser_app
    command: uvicorn crypto:app --host 0.0.0.0 --port 8000
    working_dir: /app
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  nginx:
    image: nginx:latest
    container_name: crypto_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - crypto_parser_app
    restart: always

  worker:
    build: .
    container_name: crypto_parser_worker
    command: taskiq worker broker:broker tasks
    working_dir: /app
    environment:
      PYTHONPATH: /app
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      - db
      - redis
    restart: always

  scheduler:
    build: .
    container_name: crypto_parser_scheduler
    command: taskiq scheduler scheduler:scheduler
    working_dir: /app
    environment:
      PYTHONPATH: /app
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      - db
      - redis
      - worker
    restart: always

volumes:
  postgres_data:
