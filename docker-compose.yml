version: '3.8'

services:
  db:
    image: postgres:15
    container_name: crypto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crypto_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: super_password
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: crypto_parser_app
    restart: unless-stopped
    # Запускаем приложение через uvicorn на внутреннем порту 8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=crypto_db
      - DB_USER=postgres_user
      - DB_PASS=super_password

  gateway:
    image: nginx:alpine
    container_name: crypto_nginx
    restart: unless-stopped
    # Открываем порт 80 наружу, файрвол его пропустит
    ports:
      - "80:80"
    # Пробрасываем настройки Nginx внутрь контейнера
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  pg_data:
