version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crypto_db
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: super_password
      POSTGRES_DB: crypto_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    ports:
      - "6379:6379"
    restart: always

  crypto_parser_app:
    build: .
    container_name: crypto_parser_app
    environment:
      DB_USER: postgres_user
      DB_PASS: super_password
      DB_HOST: db
      DB_NAME: crypto_db
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    restart: always

  # 1. Веб-панель для PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@crypto.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_LISTEN_PORT: 80
    restart: always

  # 2. Веб-панель для Redis
  redisinsight:
    image: redis/redisinsight:latest
    container_name: crypto_redisinsight
    ports:
      - "5540:5540"
    restart: always

  nginx:
    image: nginx:latest
    container_name: crypto_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - crypto_parser_app
      - pgadmin
      - redisinsight
    restart: always

volumes:
  postgres_data:
